name: backend

on:
  push:
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Default features only: the all-features check and the test suite need more
  # than a hosted runner has, and run on the development machine instead.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev mold cmake pkg-config libssl-dev libkrb5-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo check --workspace --all-targets
