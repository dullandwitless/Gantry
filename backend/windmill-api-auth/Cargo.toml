[package]
name = "windmill-api-auth"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "windmill_api_auth"
path = "src/lib.rs"
# src/ has no doctests: remove this line before adding one, or cargo test never runs it.
doctest = false

[features]
default = []
cloud = ["windmill-common/cloud"]
no_auth = []
mcp = ["dep:windmill-mcp", "windmill-mcp/server", "windmill-mcp/auth"]

[dependencies]
windmill-common = { workspace = true, default-features = false }
windmill-audit.workspace = true
windmill-mcp = { workspace = true, optional = true }
axum.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
itertools.workspace = true
tower-cookies.workspace = true
tracing.workspace = true
chrono.workspace = true
quick_cache.workspace = true
sqlx.workspace = true
lazy_static.workspace = true
tokio.workspace = true
time.workspace = true
anyhow.workspace = true
