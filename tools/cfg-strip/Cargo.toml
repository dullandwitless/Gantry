[package]
name = "cfg-strip"
version = "0.1.0"
edition = "2021"
description = "Removes code gated behind specific Cargo features from Rust sources and manifests, preserving formatting."
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
toml_edit = "0.22"
walkdir = "2"

[dev-dependencies]
indoc = "2"
